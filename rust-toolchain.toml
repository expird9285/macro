[toolchain]
channel = "1.94.0"
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
# The linux-gnu targets are required by `cargo x zigbuild` (the local
# orchestrator cross-compiles service binaries for the runtime image). They
# don't affect the fenix channel-manifest hash in nix/cloud-storage.nix (targets
# are selected after the manifest is fetched), so adding one needs no hash bump.
targets = [
  "wasm32-unknown-unknown",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  # Physical iOS devices and the arm64 Simulator (including ios_preview).
  # These must live here rather than in a build script: the
  # Nix dev shell's `rustup` is a shim whose `target add` silently exits 0, so
  # installing it from a CI step would appear to succeed and then fail at link
  # time.
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  # Signed Android APKs in the production release workflow.
  "aarch64-linux-android",
]
